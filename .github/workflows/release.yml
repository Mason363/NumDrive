name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: |
          make
          cp output/device/drivemad.nwa DriveMad.nwa
      - uses: actions/upload-artifact@v4
        with:
          name: DriveMad
          path: DriveMad.nwa
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DriveMad.nwa
          name: Drive Mad ${{ github.ref_name }}
          body: |
            Drive Mad for the NumWorks N0120 calculator.
            Install DriveMad.nwa from https://my.numworks.com/apps
